<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Scripture & Quiet-Time Suite</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('sqts_theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) { /* ignore */ }
    }());
  </script>

  <link rel="stylesheet" href="styles/base.css" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background-color:var(--color-background);
      color:var(--color-text-primary);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:1.5rem;
    }
    .card{
      background:var(--color-surface);
      border:1px solid var(--color-border);
      border-radius:12px;
      padding:2rem;
      max-width:480px;
      width:100%;
      text-align:center;
    }
    .card__icon{font-size:3rem;margin-bottom:1rem;}
    .card__title{font-size:1.5rem;font-weight:700;color:var(--color-accent);margin-bottom:.75rem;}
    .card__body{font-size:1rem;color:var(--color-text-secondary);line-height:1.6;margin-bottom:1.5rem;}
    .card__verse{
      font-style:italic;font-size:1.05rem;color:var(--color-text-primary);
      border-left:3px solid var(--color-accent);padding-left:1rem;
      margin-bottom:1.5rem;text-align:left;line-height:1.65;
    }
    .card__ref{font-size:.875rem;font-weight:700;color:var(--color-accent);margin-top:.5rem;}
    .card__btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:.5rem 1.5rem;
      background-color:var(--color-button-bg);color:var(--color-button-text);
      border:none;border-radius:6px;font-family:inherit;font-size:1rem;
      font-weight:600;cursor:pointer;text-decoration:none;
    }
    .card__btn:hover{opacity:.88;}
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="card__icon" aria-hidden="true">📖</div>
    <h1 class="card__title">You're Offline</h1>
    <p class="card__body">
      It looks like you're not connected to the internet. Here's a verse to
      carry with you while you wait for the connection to return.
    </p>
    <blockquote class="card__verse">
      "I can do all things through Christ who strengthens me."
      <p class="card__ref">Philippians 4:13 — NKJV</p>
    </blockquote>
    <a class="card__btn" href="dashboard.html" aria-label="Try to reload the dashboard">
      Try Again
    </a>
  </div>
</body>
</html>
